name: Build & Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 22 * * *'  # 22:00 UTC = 05:00 sáng giờ Hà Nội (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch all data into docs/data/ and data/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_build_data.py vuongdat67

      - name: Sync frontend assets (static/ -> docs/)
        run: |
          cp -f static/index.html docs/index.html
          cp -f static/css/style.css docs/css/style.css
          cp -f static/js/app.js docs/js/app.js
          cp -f static/js/charts.js docs/js/charts.js
          mkdir -p docs/img
          cp -rf static/img/* docs/img/ 2>/dev/null || true

      - name: Commit data updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ data/ github_stars.md github_stars_by_topic.md github_stars_timeline.md github_stars.csv 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily data sync [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
